{% extends 'base.html' %}

{% block title %}Editar Entrega{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">
        <i class="fas fa-edit me-2 text-primary"></i>Editar Entrega #{{ entrega.id }}
    </h4>
    <a href="{{ url_for('entregas.index') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i>Volver
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST" data-loading>
                    {{ form.hidden_tag() }}

                    {% include 'entregas/_form.html' %}

                    <hr>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('entregas.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                        {{ form.submit(class="btn btn-primary") }}
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
